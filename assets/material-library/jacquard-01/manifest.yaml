construction_lock:
  orientation_frame: "Upright design-source and finished-rug coordinates, independent of how reference photos are rotated or folded."
  coarse_raised_yarn_axis: "Vertical along the upright rug."
  fine_cross_yarn_axis: "Horizontal across the upright rug."
  fine_ground_anchor_axis: "Vertical along the upright rug, recessed beneath the raised yarn crowns."
  surface_structure: "A thin-bodied integral woven jacquard built from three coordinated visible yarn systems: compact coarse raised vertical yarns, finer horizontal cross yarns, and fine recessed vertical ground or anchoring yarns."
  yarn_geometry: "Short soft multi-filament folded floats form tapered, slightly irregular raised crowns with visible strand twist and fine fibre fuzz. The vertical crowns use two related scales: larger dominant crowns and smaller secondary crowns about 1.3–1.6 times narrower, naturally interleaved within the same yarn family."
  interlacing: "Each coarse vertical float bends over the finer horizontal cross yarns, compresses where it is tied, and sinks back into the weave between crowns. Fine horizontal yarns remain continuously exposed between vertical crowns across both plain and patterned regions; fine vertical ground or anchoring threads remain recessed beneath them."
  grain_direction: "The dominant coarse-yarn long axis and end-to-end chain rhythm run vertically in upright rug coordinates. Finer cross yarns run horizontally; fine vertical anchoring threads appear mainly in recessed channels."
  scale_behavior: "The three yarn systems are distinguishable in macro views; at product distance they become a fine tactile jacquard grain without smoothing into print or enlarging into rope."
  surface_relief: "Clearly pronounced but compact micro-relief created by believable over-under interlacing and yarn compression: soft irregular coarse crowns rise about one yarn thickness above the finer horizontal cross yarns and recessed vertical ground threads while the rug body remains thin."
  yarn_exposure_balance: "Coarse vertical crowns remain visually dominant while occupying about 55–65% of the visible woven surface. Fine horizontal cross yarns remain clearly readable across about 25–35%, including motif edges; recessed vertical ground or anchoring threads appear in the remaining channels."
  boundary_behavior: "One jacquard construction continues across colour changes. Motifs form through colour, yarn exposure, coverage and local relief while coarse-yarn calibre, fine-yarn spacing and the three-direction interlacing logic remain coherent across pattern and ground. Diagonal or stepped motif lines may have locally stronger crown exposure, but they remain transitions inside the same weave: coarse crown axes stay vertical, horizontal fine yarns cross the line, and no smooth contour tube or independent piping, embroidery, or motif-following rope is introduced."
  yarn_colour_behavior: "Every visible yarn system follows the local design-source colour region. Fine cross and ground yarns may read as tone-on-tone variations from light and depth, but are never forced to pale, white or a global binder colour."
  edge_geometry: "Narrow rounded continuous serged binding with tidy corners."
  finish: "Warm, clean soft-satin strand highlights with moderate lustre, visible fibre softness and no hard plastic gloss or dull grey cast; fibre composition is unspecified."

reference_orientation_notes:
  generation_inputs: "The product-scale and overall neutral generation inputs have no EXIF orientation dependency. The product-scale input exposes coarse raised yarns vertically and fine cross yarns horizontally; the overall input is stored in upright finished-rug orientation with coarse raised yarns vertical."
  normalisation: "Use the stored generation-input orientation directly: coarse raised yarns vertical, fine cross yarns horizontal, and fine recessed ground or anchoring yarns vertical in upright design-source coordinates. Do not rotate these inputs again."

anti_substitutions:
  - printed smooth surface
  - chunky knit
  - crochet
  - freestanding braided rope or cord
  - long open loops or oversized tubular stitches
  - basket weave
  - square or pixel blocks
  - uniform tufted loop-pile carpet with independent upright loops
  - flat plain weave with no raised jacquard bundles
  - fixed white or pale binder grid independent of artwork colours
  - isolated identical capsule beads or padded embroidery
  - uniformly inflated CGI bumps without visible interlacing or compression
  - motif-following twisted cords or raised contour piping
  - diagonal raised ropes that rotate with artwork lines
  - long fur or shag

colour_policy:
  authority_order: [explicit_colour_card, design_source]
  material_assets_have_colour_authority: false

