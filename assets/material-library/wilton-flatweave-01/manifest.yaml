construction_lock:
  surface_structure: "Low-relief, yarn-built structured weave. Regular short multi-filament bundles repeat in aligned rows; finer interlacing threads remain visible in the gaps and at the row changes."
  pile_behavior: "The bundle crowns sit only slightly above the fine interlacing system. They are compact, flattened by use and lighting, and never read as deep pile, free-standing loops, or isolated cords."
  pattern_formation: "Current artwork colours are carried by the same short bundle-and-fine-thread system in every region. Pattern edges are stepped colour transitions at the bundle scale, never printed fill, embroidery, or a raised applique."
  pattern_ground_parity: "Ground, motif, and boundary retain the same bundle size, row cadence, fine-thread visibility, low relief, and restrained filament sheen."
  organisation: "In upright product coordinates, the principal bundle rows follow the rug long axis. Fine interlacing threads cross and separate those rows; local colour changes must not rotate the construction with a motif."
  relief: "Low but legible: compact rounded bundle crowns, shallow shadowed gaps, fine interlacing traces, and modest directional highlights on the yarn filaments."
  scale_behavior: "At equal apparent area, preserve the substantial, individually legible short bundles and fine interlacing visible in the supplied macro photos. Do not collapse them into a uniform micro-bead grid or inflate them into rope."
  edge_geometry: "Rounded, continuous, colour-matched wrapped binding; an inner narrow lockstitch-like line sits just inside the binding and follows the corner without interruption."
  finish: "Clean commercial textile finish with slight filament irregularity, controlled sheen, and natural small shadows; no plastic gloss."
  fibre: unspecified
  manufacturing_process: unspecified

anti_substitutions:
  - smooth printed colour fill
  - flat RGB artwork with a texture overlay
  - deep cut pile, shag, fur, or tall open loops
  - chunky basket weave, crochet, braid, or rope
  - uniform oval-bead grid
  - applied embroidery, piping, carved motif, or raised motif layer
  - hard plastic gloss or oversized inflated cords

colour_policy:
