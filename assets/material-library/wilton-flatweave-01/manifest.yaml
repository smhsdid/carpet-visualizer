construction_lock:
  surface_structure: "Low-relief, yarn-built structured weave. Substantial multi-filament bundles occupy product-directional lanes; exposed fine interlacing and shadowed longitudinal channels remain visibly open between lanes."
  pile_behavior: "The bundle crowns sit only slightly above the fine interlacing system, but each near-detail unit has a clearly rounded, arched cross-section: a full, wider raised middle falls away into visibly narrower side shoulders. Shallow side shadows make this crown profile legible from the required raking camera. They are compact and never read as deep pile, free-standing loops, or isolated cords."
  pattern_formation: "Current artwork colours are carried by the same short bundle-and-fine-thread system in every region. Pattern edges are stepped colour transitions at the bundle scale, never printed fill, embroidery, or a raised applique."
  pattern_ground_parity: "Ground, motif, and boundary retain the same bundle size, row cadence, fine-thread visibility, low relief, and restrained filament sheen."
  organisation: "In upright product coordinates, principal bundle lanes follow the rug long axis. Adjacent lanes are visibly staggered rather than placed on one shared crosswise grid; fine interlacing threads bridge the offsets and remain exposed in the longitudinal channels. Local colour changes must not rotate the construction with a motif."
  bundle_length_variation: "Within every colour region, each small visible area contains both clearly short and clearly longer tapered bundles. Every lane is visibly segmented into separate units rather than a continuous rib; offset their endpoints across adjacent product-directional lanes."
  two_length_classes: "The short and longer bundle classes must both be plainly readable in the near-detail plane. Their alternation is irregular, never a fixed repeating sequence."
  longitudinal_channels: "Keep a clearly readable shadowed gap between adjacent product-directional bundle lanes, proportioned to the declared real camera anchor rather than reduced to a hairline seam. The gap exposes finer cross yarns and remains visually distinct between the arched bundle shoulders."
  relief: "Low but visibly dimensional: compact arched bundle crowns with full raised middles, visibly narrowed side shoulders, shallow side shadows in the open channels, fine interlacing traces, and modest directional highlights on the yarn filaments."
  scale_behavior: "At equal apparent area, preserve the coarse, individually legible short-and-long bundles, open lane channels, and fine interlacing visible in the supplied macro photos and declared camera anchor. In a raking detail camera, the closest bundles are visibly larger and more dimensional than receding bundles. Do not collapse them into a uniform micro-bead grid or inflate them into rope."
  camera_geometry: "Match the declared real lower-left camera anchor: a low raking look toward the farther rug plane, with the near corner in foreground, the left bound edge receding upward, and the upper frame continuing through carpet surface. Use the anchor's focal relationship rather than a numerical perspective approximation."
  camera_space_registration: "Use the complete current design as the sole geometry source. Preserve its original outline-to-binding, binding-to-inner-lock-line, and perimeter-to-pattern spacing while applying the camera anchor's framing; never re-space a cropped or extended artwork fragment."
  edge_geometry: "Rounded, continuous, colour-matched wrapped binding; an inner narrow lockstitch-like line sits just inside the binding and follows the corner without interruption."
  finish: "Clean commercial textile finish with slight filament irregularity, controlled sheen, and natural small shadows; no plastic gloss."
  fibre: unspecified
  manufacturing_process: unspecified

anti_substitutions:
  - smooth printed colour fill
  - flat RGB artwork with a texture overlay
  - deep cut pile, shag, fur, or tall open loops
  - chunky basket weave, crochet, braid, or rope
  - uniform oval-bead grid
  - closed equal-pitch lattice with no exposed longitudinal channels
  - equal-length bundle rows whose ends align across adjacent lanes
  - applied embroidery, piping, carved motif, or raised motif layer
  - hard plastic gloss or oversized inflated cords

