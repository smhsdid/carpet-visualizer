interface:
  display_name: "Carpet Visualizer"
  short_description: "Render carpet artwork with clear woven textures"
  default_prompt: "Use $carpet-visualizer with the standard_reference_jacquard branch. Use only the approved standard detail and standard overview texture references as the material authority; let the artwork own the motif topology and final colours. Keep the detail as an ultra-close low-grazing 8–12° tactile macro with bright clean exposure. Keep the overview as a complete upright flat rug with all four edges visible, bright clean light, a very subtle pale floor or porcelain-tile background, and a restrained natural contact shadow."
policy:
  allow_implicit_invocation: true
