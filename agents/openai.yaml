interface:
  display_name: "Carpet Visualizer"
  short_description: "Render carpet artwork with clear woven textures"
  default_prompt: "Use $carpet-visualizer with the standard_reference_jacquard branch. Generate and inspect the selected-corner material detail first, using the artwork and deterministic design crop as the strict motif and colour authority, and use the approved standard texture references only for construction. After the detail passes, use it as the texture-only material_detail_anchor for the product overview; keep the artwork as the sole authority for every overview motif, boundary and final colour. Keep the detail as a professional three-quarter tactile macro with bright clean exposure. Keep the overview as a complete upright standing-observer rug sample with all four corners and the full bound outline visible, bright clean light, a quiet pale floor background, and a restrained natural contact shadow."
policy:
  allow_implicit_invocation: true
