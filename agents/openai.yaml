interface:
  display_name: "Carpet Visualizer"
  short_description: "Render carpet artwork with clear woven textures"
  default_prompt: "Use $carpet-visualizer to turn this carpet artwork into one bright, crisp corner texture detail and one full-product overview with clear medium-high contrast. Default the detail to the lower-left corner as a close low-oblique macro photograph, with the surface filling most of the frame and grazing light revealing texture depth. Render the overview directly overhead and level, with the complete rug filling about 90–95% of the frame. Use the bundled default construction and texture references when I do not specify one."
policy:
  allow_implicit_invocation: true
