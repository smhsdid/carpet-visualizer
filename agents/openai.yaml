interface:
  display_name: "Carpet Visualizer"
  short_description: "Render carpet artwork with clear woven textures"
  default_prompt: "Use $carpet-visualizer with topology_mode: exact and the structured_woven_surface branch. Build deterministic region/edge controls and an aligned structure_proof before any material or camera rendering. Reconstruct the visible surface from stable product-directional rows of short multi-filament yarn bundles and visible finer interlacing threads across both ground and motif regions; treat the artwork as an invisible structure/colour map, never as a visible RGB base with a grayscale, luminance, normal, emboss, displacement, noise, or generic texture overlay. Preserve the rounded wrapped binding and inner locking line. Record surface_build_mode and reject overlay output. Inspect material_detail at 100% using equal-scale plain-field and patterned-boundary crops; continue to product_overview only after topology and surface-build gates pass. If the backend cannot produce that proof or yarn-built surface, return external_execution_required instead of an approximate image."
policy:
  allow_implicit_invocation: true
